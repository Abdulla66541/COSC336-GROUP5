{% extends "base.html" %}{% block title %}Register asset{% endblock %}
{% block body %}
<h1 class="h3 mb-3">Register an asset</h1>
<form method="post" class="card card-body" id="assetForm">
  <div class="row g-3">
    <div class="col-md-8"><label class="form-label">Name *</label><input class="form-control" name="name" id="name" required value="{{ form.get('name','') }}" placeholder="Dell 24-inch monitor"></div>
    <div class="col-md-4"><label class="form-label">Tag number <span class="text-muted small">(blank = automatic)</span></label><input class="form-control" name="tag_number" value="{{ form.get('tag_number','') }}"></div>
    <div class="col-12"><label class="form-label">Description</label>
      <textarea class="form-control" name="description" id="description" rows="2" placeholder="Model, size, defects…">{{ form.get('description','') }}</textarea></div>
  </div>

  <div class="my-3"><button type="button" class="btn btn-outline-success" id="aiBtn">✨ Suggest category, condition and tags (AI)</button></div>
  <div class="ai-box mb-3" id="aiBox" hidden>
    <div class="ai-label">AI suggestion · you decide</div>
    <div id="aiText" class="my-1"></div>
    <div class="small text-muted" id="aiWhy"></div>
    <button type="button" class="btn btn-sm btn-success mt-2" id="aiAccept">Accept suggestion</button>
    <span class="small text-muted">or edit the fields below yourself.</span>
  </div>
  <input type="hidden" name="ai_output_id" id="ai_output_id">
  <input type="hidden" name="ai_suggested" id="ai_suggested">

  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Category *</label><select class="form-select" name="category_id" id="category_id" required><option value="">Choose…</option>
      {% for c in categories %}<option value="{{ c.category_id }}" {% if form.get('category_id')|string == c.category_id|string %}selected{% endif %}>{{ c.label }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Condition *</label><select class="form-select" name="condition" id="condition" required>
      {% for c in conditions %}<option {% if form.get('condition') == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">Tags</label><input class="form-control" name="tags" id="tags" value="{{ form.get('tags','') }}"></div>
    <div class="col-md-4"><label class="form-label">Quantity *</label><input class="form-control" type="number" name="quantity" min="1" value="{{ form.get('quantity', 1) }}" required></div>
    <div class="col-md-4"><label class="form-label">Estimated value per unit (AED)</label><input class="form-control" type="number" step="0.01" min="0" name="est_value_aed" value="{{ form.get('est_value_aed', 0) }}"></div>
    <div class="col-md-4"><label class="form-label">Purchase date</label><input class="form-control" type="date" name="purchase_date" value="{{ form.get('purchase_date','') }}"></div>
    <div class="col-md-4"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ form.get('location','') }}"></div>
    <div class="col-md-4"><label class="form-label">Material</label><input class="form-control" name="material_type" value="{{ form.get('material_type','') }}" placeholder="metal, plastic, wood…"></div>
    {% if g.user.role == 'admin' %}
    <div class="col-md-4"><label class="form-label">Owning department</label><select class="form-select" name="owner_dept_id">{% for d in departments %}<option value="{{ d.dept_id }}">{{ d.name }}</option>{% endfor %}</select></div>
    {% endif %}
  </div>
  <div class="mt-3"><button class="btn btn-success">Register</button></div>
</form>
<script>
let last = null;
document.getElementById('aiBtn').onclick = async () => {
  const body = {name: document.getElementById('name').value, description: document.getElementById('description').value};
  const r = await fetch("{{ url_for('assets.classify') }}", {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  last = await r.json();
  document.getElementById('aiBox').hidden = false;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('aiText').innerHTML = `<b>${esc(last.category_label)}</b> · ${esc(last.condition)} · tags: ${esc(last.tags.join(', ') || '-')} · confidence <b>${last.confidence}</b>`
    + (last.low_confidence ? ' <span class="badge text-bg-danger">low confidence: please check</span>' : '');
  document.getElementById('aiWhy').textContent = 'Why: ' + last.explanation + ' (model: ' + last.model + ')';
  document.getElementById('ai_output_id').value = last.ai_output_id;
  document.getElementById('ai_suggested').value = `${last.category_id}|${last.condition}`;
};
document.getElementById('aiAccept').onclick = () => {
  if (!last) return;
  if (last.category_id) document.getElementById('category_id').value = last.category_id;
  document.getElementById('condition').value = last.condition;
  document.getElementById('tags').value = last.tags.join(', ');
};
</script>
{% endblock %}
